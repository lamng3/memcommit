name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint
        run: uv run --extra dev ruff check . && uv run --extra dev ruff format --check .
      - name: Test
        run: uv run --extra dev python -m pytest -q
      - name: Build package
        run: uv build
